name: Dynamic Language Badges

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate and Inject Badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import os, json, urllib.request, re

          # 1. Fetch user repositories
          token = os.getenv('GH_TOKEN')
          req = urllib.request.Request('https://api.github.com/users/syntaxusman/repos?per_page=100', headers={'Authorization': f'token {token}'})
          repos = json.loads(urllib.request.urlopen(req).read())
          
          # 2. Accumulate active languages
          active_languages = set()
          for r in repos:
              if r['fork']: continue
              try:
                  l_req = urllib.request.Request(r['languages_url'], headers={'Authorization': f'token {token}'})
                  langs = json.loads(urllib.request.urlopen(l_req).read())
                  for l in langs.keys():
                      active_languages.add(l.lower())
              except Exception:
                  continue

          # 3. Define your complete master-list of static badges with their custom logos/styling
          badge_master_map = {
              'python': '![Python](https://img.shields.io/badge/Python-2E3440?style=flat-square&logo=python&logoColor=white)',
              'typescript': '![TypeScript](https://img.shields.io/badge/TypeScript-2E3440?style=flat-square&logo=typescript&logoColor=white)',
              'javascript': '![JavaScript](https://img.shields.io/badge/JavaScript-2E3440?style=flat-square&logo=javascript&logoColor=white)',
              'php': '![PHP](https://img.shields.io/badge/PHP-2E3440?style=flat-square&logo=php&logoColor=white)',
              'tsql': '![SQL%20Server](https://img.shields.io/badge/Microsoft%20SQL%20Server-2E3440?style=flat-square&logo=microsoftsqlserver&logoColor=white)',
              'plpgsql': '![PostgreSQL](https://img.shields.io/badge/PostgreSQL-2E3440?style=flat-square&logo=postgresql&logoColor=white)'
          }

          # Match GitHub API language names to our badge keys
          alias_map = {'html': 'javascript', 'css': 'javascript', 'postgresql': 'plpgsql', 'sql': 'tsql'}

          # 4. Filter badges to only those active in your repos
          badges_to_show = []
          for lang in active_languages:
              target = alias_map.get(lang, lang)
              if target in badge_master_map and badge_master_map[target] not in badges_to_show:
                  badges_to_show.append(badge_master_map[target])

          badge_string = ' '.join(badges_to_show)

          # 5. Inject back into the README file
          with open('README.md', 'r') as f:
              readme_content = f.read()

          pattern = r'(<!-- START_LANG_BADGES -->)(.*?)(<!-- END_LANG_BADGES -->)'
          updated_readme = re.sub(pattern, f'\\1\n{badge_string}\n\\3', readme_content, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(updated_readme)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: dynamically updated language badges" || exit 0
          git push
